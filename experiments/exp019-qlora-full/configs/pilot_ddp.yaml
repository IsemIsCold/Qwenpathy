### model (4-bit QLoRA)
model_name_or_path: /root/participant/model
quantization_bit: 4
quantization_method: bnb
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### data
dataset_dir: /mnt/storage/sft
dataset: migu_pilot2k
template: qwen3
enable_thinking: false
cutoff_len: 6144

overwrite_cache: true
preprocessing_num_workers: 8

### train (10 steps only)
output_dir: /mnt/storage/runs/pilot_ddp
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1.0
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
logging_steps: 1
save_steps: 125
report_to: none
