### EXP-030 V4: same recipe as T7 (experiments/exp019-qlora-full/configs/full.yaml) except the marked lines
### model (4-bit QLoRA) -- the BASE model, not /root/participant/model (that is the merged T7 model since Oct 9)
model_name_or_path: /root/base_qwen3_8b
quantization_bit: 4
quantization_method: bnb
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### data
dataset_dir: /mnt/storage/sft_v4
dataset: migu_train_v4            # CHANGED: decide-first targets + rare-class repeats (train/make_v4_data.py)
eval_dataset: migu_dev200         # NEW: dev loss (T7 logged none)
template: qwen3
enable_thinking: false
cutoff_len: 6144
overwrite_cache: true
preprocessing_num_workers: 8

### train
output_dir: /mnt/storage/runs/v4
overwrite_output_dir: false       # CHANGED: a rerun after a dead boot resumes from the last checkpoint
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1.0
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
logging_steps: 10
save_steps: 250                   # CHANGED: checkpoints every ~15 min (T7: 467)
save_total_limit: 3
report_to: none

### eval (NEW)
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 250
